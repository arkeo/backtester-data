# Keep the published history current, without anyone uploading anything.
#
# Runs on GitHub's machines, which can reach all three sources — so this works
# regardless of what the publisher's own connection can get to.
#
# The job works through one instrument at a time: it restores that instrument
# from what is already published, fetches whatever is missing, seals it, uploads
# it, and deletes it before moving on. Nothing is kept between runs, because the
# release itself is the saved state — the bundles carry their own fetch
# manifests. That is what makes the whole history affordable: peak disk is one
# instrument rather than the sixteen gigabytes a full catalogue comes to, which
# fits neither this machine's disk nor its cache.
#
# Set these in the repository, under Settings -> Secrets and variables:
#   secret  BACKTESTER_KEY   the publisher key the application is built with
#   var     SYMBOLS          "all" for the whole catalogue, or a list, or a
#                            group name such as "forex" or "crypto"
#   var     MINUTES          how long one run may spend fetching (default 120)
#
# The first runs will not finish the whole catalogue — every instrument is
# fetched back to the first year its source carries, and the Dow alone is
# fetched one day at a time. That is fine and expected: each run publishes what
# it managed and the next one carries on. After a day or so the mirror is
# complete, and from then on a run only picks up the new day.

name: publish history

on:
  schedule:
    # Every three hours, not once a day.
    #
    # Publishing happens instrument by instrument, so a run that is cut short
    # still leaves the mirror better than it found it. Going often means the
    # catalogue fills in steadily and a failure costs one slot rather than a
    # whole day.
    - cron: "0 */3 * * *"
  workflow_dispatch:          # and a button, for the first run

concurrency:
  group: publish-history      # never two runs writing the same release
  cancel-in-progress: false

permissions:
  contents: write             # needed to create and update the release

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install numpy

      # The release has to exist before the job can read the listing back out
      # of it, and on the very first run it does not.
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view history >/dev/null 2>&1 \
            || gh release create history --title "Market history" \
                 --notes "Updated automatically. Sealed; opens only in the application."

      # Which sources can this runner actually reach? GitHub's machines are
      # data-centre addresses, and some feeds refuse those — which would show
      # up only as an unexplainably slow run.
      - name: Check the sources
        env:
          BACKTESTER_DATA: ${{ github.workspace }}/data
        run: |
          python - <<'EOF'
          from app.sources import net
          for name, url in [
              ("histdata", "https://www.histdata.com/download-free-forex-historical-data/"),
              ("dukascopy", "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/00/02/BID_candles_min_1.bi5"),
              ("binance", "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2024-01.zip"),
          ]:
              r = net.probe(url, timeout=20)
              print(f"{name:10s} ok={r['ok']} status={r.get('status')} {r.get('detail','')} ({r['ms']} ms)")
          EOF

      - name: Update the mirror
        env:
          BACKTESTER_DATA: ${{ github.workspace }}/data
          BACKTESTER_KEY: ${{ secrets.BACKTESTER_KEY }}
          # One instrument at a time never needs more than a fraction of a
          # gigabyte, and this machine has nothing like a desktop's free space.
          BACKTESTER_MIN_FREE_GB: "2"
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m app.mirror_job ${{ vars.SYMBOLS || 'all' }} \
            --base-url "https://github.com/${{ github.repository }}/releases/download/history" \
            --minutes "${{ vars.MINUTES || '120' }}" \
            --tag history \
            --to mirror

      - name: Stamp the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit history \
            --notes "Updated $(date -u '+%Y-%m-%d %H:%M') UTC. Sealed; opens only in the application."

      # GitHub switches off a scheduled workflow after 60 days with no
      # *commits* to the repository. Publishing releases does not count, so
      # without this the whole thing would quietly stop about two months from
      # now, with nothing broken and no obvious reason. A dated line committed
      # every couple of weeks keeps the clock reset.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "last commit was $AGE days ago"
          if [ "$AGE" -ge 14 ]; then
            date -u '+Last automatic update: %Y-%m-%d %H:%M UTC' > LAST-UPDATE.txt
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LAST-UPDATE.txt
            git commit -m "Keep the schedule alive" && git push
          else
            echo "recent enough; nothing to do"
          fi

      - name: Say where it is
        run: |
          echo "Mirror address for the application:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/history" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
