# Keep the published history current, without anyone uploading anything.
#
# Runs on GitHub's machines, which can reach all three sources — so this works
# regardless of what the publisher's own connection can get to. Each run pulls
# only what is missing (the store is cached between runs and the fetcher is
# resumable), seals the result, and replaces the release assets.
#
# Set these in the repository, under Settings -> Secrets and variables:
#   secret  BACKTESTER_KEY   the publisher key the application is built with
#   var     SYMBOLS          "all" for the whole catalogue, or a list, or a
#                            group name such as "forex" or "crypto"
#   var     YEARS            how far back to keep, e.g. "5"
#   var     MINUTES          how long one run may spend fetching (default 45)
#
# The first run will not finish the whole catalogue — the Dow alone is fetched
# one day at a time. That is fine and expected: each run publishes whatever it
# has, and the next one carries on from the manifest. After a few nights the
# mirror is complete, and from then on a run only picks up the new day.

name: publish history

on:
  schedule:
    # Every three hours, not once a day.
    #
    # Publishing happens at the END of a run, so a long run means a long time
    # with nothing at the mirror at all — on the first run, hours. Short runs
    # that go often are better in every way: something usable appears quickly,
    # the catalogue still fills in within a day, and a failure costs one slot
    # instead of a whole day.
    - cron: "0 */3 * * *"
  workflow_dispatch:          # and a button, for the first run

concurrency:
  group: publish-history      # never two runs writing the same release
  cancel-in-progress: false

permissions:
  contents: write             # needed to create and update the release

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install numpy

      # The store is what makes this cheap: after the first run each day adds
      # a day, not a decade. The key changes every run so the cache is always
      # written back; restore-keys finds the most recent one.
      - name: Restore the store
        uses: actions/cache@v4
        with:
          path: data
          key: history-${{ github.run_id }}
          restore-keys: history-

      # Which sources can this runner actually reach? GitHub's machines are
      # data-centre addresses, and some feeds refuse those — which would show
      # up only as an unexplainably slow run.
      - name: Check the sources
        env:
          BACKTESTER_DATA: ${{ github.workspace }}/data
        run: |
          python - <<'EOF'
          from app.sources import net
          for name, url in [
              ("histdata", "https://www.histdata.com/download-free-forex-historical-data/"),
              ("dukascopy", "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/00/02/BID_candles_min_1.bi5"),
              ("binance", "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2024-01.zip"),
          ]:
              r = net.probe(url, timeout=20)
              print(f"{name:10s} ok={r['ok']} status={r.get('status')} {r.get('detail','')} ({r['ms']} ms)")
          EOF

      - name: Fetch what is missing
        env:
          BACKTESTER_DATA: ${{ github.workspace }}/data
        run: |
          YEARS="${{ vars.YEARS || '5' }}"
          SYMBOLS="${{ vars.SYMBOLS || 'all' }}"
          MINUTES="${{ vars.MINUTES || '45' }}"
          FROM=$(date -u -d "$YEARS years ago" +%Y-%m-%d)
          echo "updating $SYMBOLS from $FROM, up to $MINUTES minutes"
          # The budget matters more than it looks: a run killed by the job
          # timeout publishes nothing at all, whereas one that stops itself
          # publishes everything it managed and resumes tomorrow.
          python -m app.fetch $SYMBOLS --from "$FROM" --minutes "$MINUTES"             || echo "::warning::the fetch did not complete; publishing what arrived"

      - name: Trim to the published window
        env:
          BACKTESTER_DATA: ${{ github.workspace }}/data
        run: python -m app.trim all --years "${{ vars.YEARS || '5' }}"

      - name: Seal and publish
        env:
          BACKTESTER_DATA: ${{ github.workspace }}/data
          BACKTESTER_KEY: ${{ secrets.BACKTESTER_KEY }}
        run: |
          python -m app.portable publish all --to mirror
          ls -lh mirror

      - name: Replace the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single rolling release, so the download address never changes.
          gh release view history >/dev/null 2>&1 \
            || gh release create history --title "Market history" --notes "Updated automatically."
          gh release upload history mirror/* --clobber
          gh release edit history \
            --notes "Updated $(date -u '+%Y-%m-%d %H:%M') UTC. Sealed; opens only in the application."

      # GitHub switches off a scheduled workflow after 60 days with no
      # *commits* to the repository. Publishing releases does not count, so
      # without this the whole thing would quietly stop about two months from
      # now, with nothing broken and no obvious reason. A dated line committed
      # every couple of weeks keeps the clock reset.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "last commit was $AGE days ago"
          if [ "$AGE" -ge 14 ]; then
            date -u '+Last automatic update: %Y-%m-%d %H:%M UTC' > LAST-UPDATE.txt
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LAST-UPDATE.txt
            git commit -m "Keep the schedule alive" && git push
          else
            echo "recent enough; nothing to do"
          fi

      - name: Say where it is
        run: |
          echo "Mirror address for the application:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/history" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
